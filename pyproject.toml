[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "secscan"
version = "0.1.1"
description = "Grade a website's HTTP security headers and TLS configuration from the command line."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "hunter1on1" }]
requires-python = ">=3.10"
keywords = ["security", "http-headers", "tls", "scanner", "cli", "appsec"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.25",
    "rich>=13.0",
    "certifi>=2023.7.22",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]

[project.scripts]
secscan = "secscan.cli:main"

[project.urls]
Homepage = "https://github.com/hunter1on1/secscan"
Issues = "https://github.com/hunter1on1/secscan/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/secscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"src/secscan/tls.py" = ["S501", "S502", "S503", "S504"]  # weak protocols are probed on purpose
"src/secscan/models.py" = ["S105"]  # Status.PASS is not a password
